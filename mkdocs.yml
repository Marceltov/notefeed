site_name: notefeed
site_description: Post markdown notes over HTTP, read them back as RSS.
site_url: https://docs.notefeed.me/
repo_url: https://github.com/notefeed/notefeed
repo_name: notefeed/notefeed
edit_uri: edit/main/docs/

# docs/superpowers/ holds local working notes (gitignored); never publish them.
exclude_docs: |
  superpowers/
  adr/

theme:
  name: material
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: assets/icon.svg
  favicon: assets/icon.svg
  features:
    - content.code.copy
    - navigation.footer
    - search.highlight
    - navigation.sections
    - navigation.indexes

plugins:
  - search
  - swagger-ui-tag

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.keys

validation:
  anchors: warn

nav:
  - Home: index.md
  - Hosted service: hosted.md
  - Get started:
      - Quick start: get-started/quick-start.md
      - Concepts: get-started/concepts.md
      - Compared to other tools: get-started/comparison.md
  - Using notefeed:
      - Web UI: using/web-ui.md
      - Posting notes: using/posting.md
      - Posting from scripts: using/scripts.md
      - Pictures: using/pictures.md
      - Titles and tags: using/titles-and-tags.md
      - Editing and deleting notes: using/editing.md
      - Feeds: using/feeds.md
      - Feed passwords: using/feed-passwords.md
      - Read links: using/read-links.md
      - RSS and dashboards: using/rss.md
  - Integrations:
      - Client libraries: integrations/clients.md
      - Command line: integrations/cli.md
      - REST API: integrations/api.md
      - MCP: integrations/mcp.md
  - Self-hosting:
      - Configuration: self-hosting/configuration.md
      - Passwords and access: self-hosting/access.md
      - Imprint and privacy page: self-hosting/legal-pages.md
      - Reserved feeds: self-hosting/reserved-feeds.md
      - OAuth for MCP: self-hosting/oauth.md
      - Rate limits and caps: self-hosting/limits.md
      - Reverse proxy: self-hosting/reverse-proxy.md
      - Sign-in and sender:
          - self-hosting/sign-in/index.md
          - Setup: self-hosting/sign-in/setup.md
          - Providers: self-hosting/sign-in/providers.md
          - The sender: self-hosting/sign-in/sender.md
          - Troubleshooting: self-hosting/sign-in/troubleshooting.md
      - Storage: self-hosting/storage.md
      - PostgreSQL: self-hosting/postgres.md
      - Backups: self-hosting/backups.md
      - Deleting notes and feeds: self-hosting/deleting.md
      - Metrics: self-hosting/metrics.md
      - Logs: self-hosting/logs.md
      - Upgrading: self-hosting/upgrading.md
      - Running from source: self-hosting/running-from-source.md
