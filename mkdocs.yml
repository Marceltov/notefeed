site_name: notefeed
site_description: Post markdown notes over HTTP, read them back as RSS.
site_url: https://docs.notefeed.me/
repo_url: https://github.com/Marceltov/notefeed
repo_name: Marceltov/notefeed
edit_uri: edit/main/docs/

# docs/superpowers/ holds local working notes (gitignored); never publish them.
exclude_docs: |
  superpowers/
  adr/

theme:
  name: material
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  favicon: assets/icon.svg
  features:
    - content.code.copy
    - navigation.footer
    - search.highlight

plugins:
  - search
  - swagger-ui-tag

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.keys

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Posting notes: posting.md
  - Client libraries: clients.md
  - REST API: api.md
  - MCP: mcp.md
  - Web UI: web-ui.md
  - Read links and RSS: feed.md
  - Configuration: configuration.md
  - Reverse proxy: reverse-proxy.md
  - Operations: operations.md
