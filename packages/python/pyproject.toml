[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notefeed"
version = "0.9.0"
description = "Client and CLI for notefeed, a self-hosted inbox for markdown notes that you read back as RSS."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marcel Bruckner" }]
keywords = ["notefeed", "notes", "markdown", "rss", "self-hosted", "homelab", "cli"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28", "attrs>=24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Communications",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[project.scripts]
notefeed = "notefeed.cli:main"

[project.urls]
Homepage = "https://docs.notefeed.me/"
Documentation = "https://docs.notefeed.me/integrations/clients/"
Source = "https://github.com/Marceltov/notefeed"
Issues = "https://github.com/Marceltov/notefeed/issues"
Changelog = "https://github.com/Marceltov/notefeed/releases"
