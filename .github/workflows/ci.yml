name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Main pushes build :main + :latest; vX.Y.Z tags build :X.Y.Z/:X.Y/:X + :latest and a
  # GitHub release (same scheme as the MCP repos). The client packages release from the
  # same tags in clients.yml.
  image:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Derived from the repository so an account rename doesn't break the push.
      - run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # branch push -> :main (+ :latest via the raw rule); v* tag -> semver tags + :latest (latest=auto)
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag a commit (git tag -a vX.Y.Z) to publish a GitHub release. The notes are the annotated
  # tag message plus a fixed install section. Re-runs update the release in place.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Annotated tag message only: for a lightweight tag, %(contents) would be the commit message.
          if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          else
            : > notes.md
          fi
          [ -s notes.md ] && printf '\n---\n\n' >> notes.md
          cat >> notes.md <<'EOF'
          ## Install

          ```yaml
          # compose.yaml
          services:
            notefeed:
              image: ghcr.io/marceltov/notefeed:__VERSION__
              restart: unless-stopped
              ports:
                - "3000:3000"
              environment:
                TZ: Europe/Berlin
                # PUBLIC_URL: https://notes.example.com
                # NOTEFEED_PASSWORD: change-me   # optional: lock posting and the web UI
              volumes:
                - ./data:/data
          ```

          ```bash
          mkdir data   # notes are written as the owner of this folder
          docker compose up -d
          ```

          Then open http://localhost:3000 and pick a hard-to-guess feed name.

          Client packages at this version: `pip install notefeed==__VERSION__` · `npm install notefeed@__VERSION__`

          Documentation: https://docs.notefeed.me/
          EOF
          # The git tag keeps its v (v0.1.1); image and package versions drop it (0.1.1).
          sed -i "s|__VERSION__|${TAG#v}|g" notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
